[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests - pure functions, no I/O (fast)
    integration: Integration tests - API endpoints with mocked externals (medium)
    e2e: End-to-end tests - full user flows (slow)
    slow: Tests that take > 1 second
    external: Tests requiring external services (skip in CI)

# Default options
addopts =
    --strict-markers
    -v
    --tb=short
    --maxfail=10

# Coverage configuration (use with --cov flag)
# Example: pytest --cov=src --cov-report=html

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Timeout for async tests (use pytest-asyncio >= 0.23 for asyncio_default_fixture_loop_scope)
# asyncio_default_fixture_loop_scope = function

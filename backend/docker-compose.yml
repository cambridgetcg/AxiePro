  #     DATABASE_URL: postgresql://axie:axie_dev_password@db:5432/axie_explorer
  #     REDIS_URL: redis://redis:6379
  #     MORALIS_API_KEY: ${MORALIS_API_KEY}
  #     SKYMAVIS_API_KEY: ${SKYMAVIS_API_KEY}
  #   ports:
  #     - "8000:8000"

version: "3.8"

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: axie_postgres
    environment:
      POSTGRES_USER: axie
      POSTGRES_PASSWORD: axie_dev_password
      POSTGRES_DB: axie_explorer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axie -d axie_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: axie_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment when ready to containerize the backend

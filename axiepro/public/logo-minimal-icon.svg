<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="300" height="300" rx="60" fill="#0A0E27"/>

  <!-- Main hexagonal "A" icon centered -->
  <g transform="translate(150, 150)">
    <!-- Hexagon outline -->
    <polygon points="0,-80 70,-40 70,40 0,80 -70,40 -70,-40"
             fill="none"
             stroke="#3B82F6"
             stroke-width="4"
             stroke-linejoin="round"
             opacity="0.3"/>

    <!-- Filled hexagon with gradient effect -->
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37"
             fill="#1E293B"
             stroke="#60A5FA"
             stroke-width="2.5"
             stroke-linejoin="round"/>

    <!-- Bold "A" shape -->
    <path d="M -40,-20 L 0,-60 L 40,-20 L 40,30 L 25,30 L 25,-10 L -25,-10 L -25,30 L -40,30 Z"
          fill="#3B82F6"/>

    <!-- Horizontal bar in "A" -->
    <rect x="-18" y="-3" width="36" height="9" fill="#0A0E27"/>

    <!-- Accent corner dots (analytics theme) -->
    <circle cx="50" cy="-58" r="6" fill="#60A5FA"/>
    <circle cx="-50" cy="58" r="6" fill="#60A5FA"/>
    <circle cx="58" cy="50" r="5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="-58" cy="-50" r="5" fill="#3B82F6" opacity="0.8"/>
  </g>
</svg>

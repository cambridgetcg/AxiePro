<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with dark theme -->
  <circle cx="150" cy="150" r="145" fill="#0A0E27"/>
  <circle cx="150" cy="150" r="140" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <!-- Geometric "A" shape - hexagon inspired (Axie reference) -->
  <g transform="translate(150, 140)">
    <!-- Outer hexagon frame -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32"
             fill="none"
             stroke="#60A5FA"
             stroke-width="3"
             stroke-linejoin="round"/>

    <!-- "A" letter formed by geometric shapes -->
    <path d="M -30,-15 L 0,-45 L 30,-15 L 30,25 L 20,25 L 20,-5 L -20,-5 L -20,25 L -30,25 Z"
          fill="#3B82F6"/>

    <!-- Horizontal bar cutout in "A" -->
    <rect x="-15" y="-2" width="30" height="6" fill="#0A0E27"/>

    <!-- Data points (analytics theme) -->
    <circle cx="42" cy="-48" r="5" fill="#60A5FA"/>
    <circle cx="-42" cy="48" r="5" fill="#60A5FA"/>
    <circle cx="48" cy="42" r="4" fill="#3B82F6" opacity="0.7"/>
    <circle cx="-48" cy="-42" r="4" fill="#3B82F6" opacity="0.7"/>

    <!-- Connection lines (data visualization) -->
    <line x1="42" y1="-48" x2="30" y2="-32" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
    <line x1="-42" y1="48" x2="-30" y2="32" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- "PRO" indicator -->
  <g transform="translate(150, 220)">
    <rect x="-25" y="-8" width="50" height="16" rx="8" fill="#3B82F6" opacity="0.2"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="10" font-weight="bold"
          fill="#60A5FA" text-anchor="middle">PRO</text>
  </g>
</svg>

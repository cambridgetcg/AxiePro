name: Deploy Backend to App Runner

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: axiepro-backend
  APP_RUNNER_SERVICE: axiepro-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Trigger App Runner deployment
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}'].ServiceArn" \
            --output text)

          echo "Triggering deployment for service: $SERVICE_ARN"
          aws apprunner start-deployment --service-arn $SERVICE_ARN

      - name: Wait for deployment
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}'].ServiceArn" \
            --output text)

          echo "Waiting for deployment to complete..."

          for i in {1..30}; do
            STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN \
              --query "Service.Status" --output text)

            echo "Status: $STATUS (attempt $i/30)"

            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment complete!"
              exit 0
            elif [[ "$STATUS" == *"FAILED"* ]]; then
              echo "Deployment failed!"
              exit 1
            fi

            sleep 10
          done

          echo "Timeout waiting for deployment"
          exit 1

      - name: Verify health endpoint
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}'].ServiceArn" \
            --output text)

          SERVICE_URL=$(aws apprunner describe-service --service-arn $SERVICE_ARN \
            --query "Service.ServiceUrl" --output text)

          echo "Checking health at https://$SERVICE_URL/health"
          curl -sf "https://$SERVICE_URL/health" || exit 1
          echo ""
          echo "Health check passed!"
